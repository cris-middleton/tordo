[pytest]
testpaths = tests
# Dos entradas porque el ETL convive con dos convenciones de import:
#   .   → `analytics.evaluation.*`, como se invocan los módulos desde etl/
#   ..  → `etl.loaders.*`, como importan main.py y run_all.py
# Unificarlas es trabajo aparte (requiere que el ETL sea un paquete instalado,
# no ejecutado en su sitio).
pythonpath = . ..
addopts = -ra
