<!doctype html>
<!--
  Plantilla de la imagen Open Graph (frontend/public/og.png).

  Para regenerarla, renderiza este archivo a 1200×630 con cualquier navegador
  headless y guarda el PNG en frontend/public/og.png. Con el Chromium de
  Playwright, por ejemplo:

    chrome-headless-shell --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=og.png file://$PWD/docs/assets/og-template.html

  Usa los mismos tokens y tipografías que el sitio: navy #102858, teal #3DB9BB,
  Outfit para el titular, DM Sans para el cuerpo y Varien para el logotipo. Si
  cambia la paleta, este archivo cambia con ella — no lo dejes desincronizado.
-->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=DM+Sans:wght@400;500&display=swap">
<style>
  @font-face { font-family:'Varien'; src:url('../../frontend/public/fonts/varien/Varien.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:1200px; height:630px; background:#102858; color:#fff; font-family:'DM Sans',sans-serif;
         position:relative; overflow:hidden; display:flex; flex-direction:column;
         justify-content:center; padding:0 84px }
  /* misma retícula de puntos y misma hairline teal que el hero de la landing */
  .grid { position:absolute; inset:0; opacity:.05;
          background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0); background-size:28px 28px }
  .rule { position:absolute; left:0; right:0; bottom:0; height:4px;
          background:linear-gradient(to right,transparent,#3DB9BB,transparent) }
  .lockup { display:flex; align-items:center; gap:18px; margin-bottom:46px; position:relative }
  .word { font-family:'Varien'; font-size:64px; line-height:.78; letter-spacing:-.01em }
  h1 { font-family:'Outfit',sans-serif; font-size:62px; line-height:1.1; font-weight:700;
       letter-spacing:-.025em; max-width:15ch; position:relative }
  h1 em { font-style:normal; color:#3DB9BB }
  p { margin-top:28px; font-size:26px; line-height:1.45; color:rgba(255,255,255,.72);
      max-width:31ch; position:relative }
  .pie { position:absolute; left:84px; bottom:50px; font-size:19px; color:rgba(255,255,255,.52);
         display:flex; align-items:center; gap:11px }
  .dot { width:9px; height:9px; border-radius:50%; background:#3DB9BB; display:block }
</style></head><body>
