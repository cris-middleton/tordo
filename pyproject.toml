[project]
name = "tordo"
version = "0.0.0"  # placeholder — la versión del servicio vive en backend/app/config.py
description = "TORDO — SaaS de inteligencia y compliance para licitaciones públicas de Chile"
# Techo en 3.13: las imágenes son python:3.11-slim y numpy 1.26.2 / pandas 2.1.3
# no compilan en 3.13. Subir el techo requiere subir esos dos pines primero.
requires-python = ">=3.11,<3.13"
# Sin dependencias a nivel de proyecto: cada componente declara las suyas en
# [dependency-groups]. Ver el grupo `shared` para lo que backend y ETL comparten.
dependencies = []

[tool.uv]
# Proyecto virtual: no se construye ni se instala como paquete. `backend/app` y
# `etl` se ejecutan en su sitio (WORKDIR + PYTHONPATH), igual que hasta ahora.
package = false

# ─────────────────────────────────────────────────────────────────────────────
# Dependencias por componente (PEP 735)
#
#   uv sync --no-default-groups --group api    → imagen del backend
#   uv sync --no-default-groups --group etl    → imagen del ETL
#   uv sync                                    → desarrollo (api + etl + dev)
#
# Los pines son un traspaso fiel de los antiguos backend/requirements.txt y
# etl/requirements.txt: se preservan exactos para no cambiar comportamiento en
# runtime. Depurarlos es trabajo aparte, con tests corriendo.
# ─────────────────────────────────────────────────────────────────────────────
[dependency-groups]

# Lo que backend y ETL comparten. Antes estaba duplicado en los dos
# requirements.txt, con riesgo de divergencia silenciosa.
shared = [
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg2-binary>=2.9.10,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.2,<2",
    # 0.20.15 no tiene DataFrame.join(coalesce=...), que usa
    # etl/analytics/evaluation/metrics.py — 5 tests del harness fallaban.
    "polars>=0.20.31,<0.21",
    "pyarrow>=18,<26",
    "httpx>=0.27,<1",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "joblib>=1.4,<2",
]

api = [
    { include-group = "shared" },
    # Web
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    # Servidor MCP. Se fija a la MAYOR, no a la menor: el ADR 0004 pausó esto en
    # parte porque el protocolo se mueve rápido, y un rango abierto convertiría
    # una rotura suya en una rotura nuestra sin aviso.
    "mcp>=2,<3",
    # Hoy sin uso: guardaba los documentos de las empresas, que se fueron con las
    # cuentas en el pivote público. Se conserva porque el paso 6 lo necesita para
    # subir los parquets de analytics a R2 (docs/PIVOTE_PUBLICO_2026-10.md, D3).
    "boto3>=1.35,<2",
    # Base de datos
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "greenlet>=3.1,<4",
    # Observabilidad
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "python-json-logger>=2.0.7,<4.0.0",
]

etl = [
    { include-group = "shared" },
    # 2.31 filtraba credenciales de .netrc con URLs maliciosas
    # (GHSA-9hjg-9r4m-mvj7). El ETL llama a Mercado Público con ticket.
    "requests>=2.34,<3",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "python-dateutil>=2.9,<3",
    "pytz>=2025.2",
    "structlog>=24.4,<27",
]

dev = [
    # Arranca el ciclo de vida de la app en los tests. Hace falta para el MCP:
    # montar una app ASGI dentro de otra no lo ejecuta, y sin el gestor de
    # sesiones el servidor acepta la conexión y revienta en la primera llamada.
    "asgi-lifespan>=2,<3",
    { include-group = "api" },
    { include-group = "etl" },
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.4",
    "pre-commit>=4.0.0",
]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — misma configuración que los backends de ~/github
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "backend/alembic/versions",
    "docs/_archive",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    # ── Decisiones permanentes ───────────────────────────────────────────────
    "E501",   # línea larga — lo maneja el formateador
    "E712",   # comparación con True/False — válido en filtros de SQLAlchemy
    "B008",   # llamadas en defaults de argumentos — es el patrón de Depends() de FastAPI
    "B904",   # raise sin from — a veces intencional
    "UP006",  # Dict/List en anotaciones — migración aparte
    "UP035",  # imports deprecados de typing — migración aparte
    "SIM108", # ternarios forzados — daña la legibilidad en varios sitios
    "SIM102", # ifs anidados colapsables — los 11 que quedan llevan un comentario
              # entre los dos ifs, y colapsarlos lo dejaría huérfano. Mismo
              # criterio que SIM108: la regla pide algo más corto, no más claro.

    # ── Deuda registrada, NO permanente ──────────────────────────────────────
    # (vacía)
    #
    # Las cinco que había se resolvieron, no se re-silenciaron:
    #   B007  (21) → variables de bucle sin usar, renombradas a `_`.
    #   B905  (13) → `zip()` sin `strict=`. Se puso `strict=True` en todos los
    #                sitios donde el largo está garantizado por construcción, que
    #                son todos menos la iteración por pares de `test_splits.py`.
    #                El autofix propone `strict=False`, que conserva el
    #                truncamiento silencioso y sólo calla la regla — es lo
    #                contrario de arreglarlo.
    #   E722  ( 3) → `except:` desnudo alrededor de `datetime.fromisoformat`,
    #                acotado a `ValueError`. Un desnudo se traga
    #                `KeyboardInterrupt` y `SystemExit`, así que un ETL colgado
    #                no se podía interrumpir.
    #   UP042 ( 3) → enums que ya heredan de `StrEnum`.
    #   E741  ( 2) → ya estaba en cero; sobraba en la lista.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]           # re-exports intencionales
"backend/tests/**" = ["ARG", "S", "E402"]  # fixtures, asserts e imports a media altura
# Estos módulos manipulan sys.path antes de importar (patrón de script suelto),
# así que E402 es un falso positivo. Desaparece cuando el ETL consuma el backend
# como paquete en vez de por sys.path.
"etl/shared_imports.py" = ["E402"]
"etl/analytics/run_all.py" = ["E402"]
"etl/scripts/**" = ["E402"]
"backend/scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "etl"]
