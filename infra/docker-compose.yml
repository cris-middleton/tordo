# Nombre explícito del proyecto de Compose.
# Sin esto Compose lo deriva del directorio ("infra") y COLISIONA con el repo
# ~/github/infra de otra empresa: contenedores huérfanos, redes compartidas y `down`
# apagando servicios del otro proyecto.
name: tordo

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tordo_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licitaciones_network

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: tordo_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licitaciones_network

  # MinIO — S3-compatible object store for local dev document storage
  minio:
    image: minio/minio:latest
    container_name: tordo_minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licitaciones_network

  # MinIO setup — creates the default bucket on first start
  minio-setup:
    image: minio/mc:latest
    container_name: tordo_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${AWS_BUCKET:-tordo-docs};
        mc anonymous set download local/${AWS_BUCKET:-tordo-docs};
        exit 0;
      "
    networks:
      - licitaciones_network

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tordo_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      STORAGE_BACKEND: s3
      AWS_BUCKET: ${AWS_BUCKET:-tordo-docs}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ENDPOINT_URL_PUBLIC: ${S3_ENDPOINT_URL_PUBLIC:-http://localhost:9000}
      MERCADO_PUBLICO_TICKET: ${MERCADO_PUBLICO_TICKET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      FEATURE_WHATSAPP: ${FEATURE_WHATSAPP:-false}
      FEATURE_ANALYTICS: ${FEATURE_ANALYTICS:-true}
      FEATURE_TFIDF: ${FEATURE_TFIDF:-true}
    volumes:
      - ../backend:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - licitaciones_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery_worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        # Este worker lanza el ETL como subproceso: necesita sus dependencias
        # (pandas, numpy, pytz, structlog). La API no las lleva a propósito.
        UV_GROUPS: "--group api --group etl"
    container_name: tordo_celery_worker
    environment:
      # Vacío = logs a stdout (etl/main.py usa StreamHandler). Escribir
      # etl.log dentro del repo no sirve en contenedores.
      LOG_FILE: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      STORAGE_BACKEND: s3
      AWS_BUCKET: ${AWS_BUCKET:-tordo-docs}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ENDPOINT_URL_PUBLIC: ${S3_ENDPOINT_URL_PUBLIC:-http://localhost:9000}
      MERCADO_PUBLICO_TICKET: ${MERCADO_PUBLICO_TICKET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      FEATURE_WHATSAPP: ${FEATURE_WHATSAPP:-false}
    volumes:
      - ../backend:/app
      - /app/__pycache__
      # Lectura Y ESCRITURA: la tarea run_bulk_semanal descarga ZIPs y genera
      # parquets bajo etl/data. Con `:ro` fallaba con OSError read-only, así
      # que el bulk semanal nunca pudo funcionar en Docker.
      - ..:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "active", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tordo_celery_beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    volumes:
      - ../backend:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network

  # Flower — Celery task monitoring UI
  flower:
    image: mher/flower:2.0.0
    container_name: tordo_flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network

  # ETL Service
  etl:
    build:
      context: ..
      dockerfile: etl/Dockerfile
    container_name: tordo_etl
    environment:
      # Vacío = logs a stdout (etl/main.py usa StreamHandler). Escribir
      # etl.log dentro del repo no sirve en contenedores.
      LOG_FILE: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${ETL_LOG_LEVEL:-INFO}
      ETL_SCHEDULE_INTERVAL: ${ETL_SCHEDULE_INTERVAL:-3600}
      CHILECOMPRA_API_URL: ${CHILECOMPRA_API_URL:-}
      MERCADO_PUBLICO_URL: ${MERCADO_PUBLICO_URL:-https://api.mercadopublico.cl}
      MERCADO_PUBLICO_TICKET: ${MERCADO_PUBLICO_TICKET:-F8537A18-6766-4DEF-9E59-426B4FEE2844}
      PYTHONPATH: /workspace
    volumes:
      - ..:/workspace
      - /workspace/etl/__pycache__
    working_dir: /workspace/etl
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network
    # Uncomment to run ETL on a schedule
    # command: python -m schedule main.py

  # Frontend (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tordo_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    depends_on:
      - backend
    networks:
      - licitaciones_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  licitaciones_network:
    driver: bridge
