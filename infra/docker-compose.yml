# Nombre explícito del proyecto de Compose.
# Sin esto Compose lo deriva del directorio ("infra") y COLISIONA con el repo
# ~/github/infra de otra empresa: contenedores huérfanos, redes compartidas y `down`
# apagando servicios del otro proyecto.
name: tordo

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tordo_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licitaciones_network

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: tordo_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - licitaciones_network

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tordo_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      # Lista blanca de `Host` del MCP (protección contra DNS rebinding). En
      # producción tiene que llevar el dominio público.
      MCP_HOSTS_PERMITIDOS: ${MCP_HOSTS_PERMITIDOS:-localhost,127.0.0.1}
      FEATURE_ANALYTICS: ${FEATURE_ANALYTICS:-true}
      FEATURE_TFIDF: ${FEATURE_TFIDF:-true}
      # Dónde están los artefactos del modelo TF-IDF que produce el ETL. Sin
      # esto la ruta por defecto es relativa (`etl/data/analytics`) y dentro del
      # contenedor apunta a /app/etl/…, que no existe: el orden por relevancia
      # respondía «Modelo TF-IDF no entrenado» con el modelo ahí.
      ANALYTICS_DATA_PATH: /analytics
    volumes:
      - ../backend:/app
      - /app/__pycache__
      - ../etl/data/analytics:/analytics:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - licitaciones_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery_worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        # Este worker lanza el ETL como subproceso: necesita sus dependencias
        # (pandas, numpy, pytz, structlog). La API no las lleva a propósito.
        UV_GROUPS: "--group api --group etl"
    container_name: tordo_celery_worker
    environment:
      # Vacío = logs a stdout (etl/main.py usa StreamHandler). Escribir
      # etl.log dentro del repo no sirve en contenedores.
      LOG_FILE: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      # El worker lanza el ETL como subproceso con su `os.environ`: el ticket
      # tiene que estar aquí aunque la API ya no lo use.
      MERCADO_PUBLICO_TICKET: ${MERCADO_PUBLICO_TICKET:-}
      FEATURE_ANALYTICS: ${FEATURE_ANALYTICS:-true}
      FEATURE_TFIDF: ${FEATURE_TFIDF:-true}
      ANALYTICS_DATA_PATH: /workspace/etl/data/analytics
    volumes:
      - ../backend:/app
      - /app/__pycache__
      # Lectura Y ESCRITURA: la tarea run_bulk_semanal descarga ZIPs y genera
      # parquets bajo etl/data. Con `:ro` fallaba con OSError read-only, así
      # que el bulk semanal nunca pudo funcionar en Docker.
      - ..:/workspace
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "active", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tordo_celery_beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
    volumes:
      - ../backend:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network

  # Flower — Celery task monitoring UI
  flower:
    image: mher/flower:2.0.0
    container_name: tordo_flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network

  # ETL Service
  etl:
    build:
      context: ..
      dockerfile: etl/Dockerfile
    container_name: tordo_etl
    environment:
      # Vacío = logs a stdout (etl/main.py usa StreamHandler). Escribir
      # etl.log dentro del repo no sirve en contenedores.
      LOG_FILE: ""
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-licitaciones}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${ETL_LOG_LEVEL:-INFO}
      ETL_SCHEDULE_INTERVAL: ${ETL_SCHEDULE_INTERVAL:-3600}
      CHILECOMPRA_API_URL: ${CHILECOMPRA_API_URL:-}
      MERCADO_PUBLICO_URL: ${MERCADO_PUBLICO_URL:-https://api.mercadopublico.cl}
      # Sin valor por defecto A PROPÓSITO. Aquí había un ticket de demostración
      # como respaldo, así que un despliegue que olvidara la variable no fallaba:
      # se iba a la API con la credencial compartida de pruebas y traía datos
      # limitados, pareciendo que funcionaba. `${VAR:?mensaje}` corta el arranque
      # con una explicación en vez de degradar en silencio.
      MERCADO_PUBLICO_TICKET: ${MERCADO_PUBLICO_TICKET:?falta MERCADO_PUBLICO_TICKET en el .env (ver .env.example)}
      PYTHONPATH: /workspace
    volumes:
      - ..:/workspace
      - /workspace/etl/__pycache__
    working_dir: /workspace/etl
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - licitaciones_network
    # Uncomment to run ETL on a schedule
    # command: python -m schedule main.py

  # Frontend (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # Van como ARG y no en `environment` porque Next inlinea todo lo
      # NEXT_PUBLIC_* durante el build: en ejecución ya es tarde.
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Tordo}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tordo.cl}
    container_name: tordo_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Nombre interno de Docker: ahora es correcto porque quien resuelve esta
      # URL es el servidor de Next, no el navegador.
      API_URL: ${API_URL:-http://backend:8000}
    depends_on:
      - backend
    networks:
      - licitaciones_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  licitaciones_network:
    driver: bridge
