name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: uv.lock sincronizado con pyproject.toml
        run: uv lock --check

      - name: ruff check
        run: uv run ruff check backend/app backend/tests etl --output-format=github

      - name: ruff format --check
        run: uv run ruff format --check backend/app backend/tests etl

  # ───────────────────────────────────────────────────────────────────────────
  migrations:
    name: 🗃️ Migraciones
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tordo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Una sola cabeza de migración
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tordo_test
          SECRET_KEY: ci-secret
        run: |
          heads=$(uv run --project .. alembic heads | grep -c '(head)' || true)
          echo "cabezas encontradas: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Se esperaba exactamente 1 cabeza de Alembic, hay $heads. Cadena de down_revision rota."
            uv run --project .. alembic heads
            exit 1
          fi

      # El ciclo completo, no sólo la ida. `upgrade -> downgrade` pasa aunque el
      # downgrade deje basura (tipos ENUM huérfanos, secuencias, constraints);
      # el segundo `upgrade` es el que lo destapa. Es además lo que hace un dev
      # iterando sobre una migración.
      - name: Ciclo upgrade → downgrade → upgrade sobre base vacía
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tordo_test
          SECRET_KEY: ci-secret
        run: |
          uv run --project .. alembic upgrade head
          uv run --project .. alembic downgrade base
          uv run --project .. alembic upgrade head

      # INFORMATIVO, todavía no bloqueante.
      #
      # BLOQUEANTE desde la migración da5fb1e45066.
      #
      # Estuvo en `continue-on-error` mientras los modelos y las migraciones
      # divergían. Ya no divergen: si esto falla, es que un modelo cambió sin su
      # migración (o al revés), y eso tiene que parar el PR.
      #
      # Ojo con `unique=True`: `app/db/__init__.py` fija la convención
      # `uq_<tabla>_<columna>` y Alembic se la pasa a `op.create_table`, así que
      # afecta también a lo que producen las migraciones ya escritas.
      - name: Deriva entre modelos y migraciones
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tordo_test
          SECRET_KEY: ci-secret
        run: uv run --project .. alembic check

  # ───────────────────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Tests backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tordo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      # Las migraciones ANTES de los tests: varios comprueban el aislamiento
      # entre empresas y el flujo de suscripción contra tablas reales. Sin
      # esquema fallaban con "relation users does not exist" — y un test que
      # sólo puede correr contra SQLite no prueba lo que hace falta probar.
      - name: Aplicar migraciones
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tordo_test
          SECRET_KEY: ci-secret
        run: uv run --project .. alembic upgrade head

      # El golden master de BI (31 casos sobre services/bi/) necesita el esquema
      # `analytics` materializado. Sin esto se saltaba en silencio y esos 31
      # casos no corrían en ninguna parte automáticamente.
      - name: Materializar analytics (fixture del golden)
        working-directory: etl
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tordo_test
          SECRET_KEY: ci-secret
        run: uv run --project .. python -m analytics.materialize --data-dir ../backend/tests/golden/fixture_analytics

      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tordo_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret
        run: uv run --project .. pytest --cov=app --cov-report=term-missing

  # ───────────────────────────────────────────────────────────────────────────
  test-etl:
    name: 🧪 Tests ETL
    runs-on: ubuntu-latest
    # El materializador de analytics usa COPY, swap atómico de tablas y
    # renombrado de índices: necesita Postgres real, no se puede simular.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tordo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: pytest
        working-directory: etl
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tordo_test
          SECRET_KEY: ci-secret
        run: uv run --project .. pytest

  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      # Sin `NEXT_PUBLIC_API_URL`: desapareció al pasar el tráfico por
      # /api/proxy. La URL del backend es de servidor (`API_URL`).
      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: 🎭 Extremo a extremo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          uv sync --frozen
          cd frontend && npm ci

      # El navegador se instala en el runner en vez de bajar la imagen de
      # Playwright. La imagen pesa ~2 GB y desde Actions tardaba cuatro minutos
      # entre reintentos hasta morir con `connection reset by peer`; esto tarda
      # menos de un minuto. Localmente sigue usándose el contenedor, porque
      # `--with-deps` pide sudo — `scripts/e2e.sh` elige solo.
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # `make e2e` monta la pila entera: Postgres efímero, migraciones, semilla,
      # backend y el servidor de Next. El MISMO comando que en local — un E2E
      # que sólo existe en CI no lo usa nadie para depurar.
      - name: Playwright
        env:
          E2E_NAVEGADOR: nativo
        run: make e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build de imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # El contexto es la raíz del repo: pyproject.toml y uv.lock viven ahí.
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build ETL
        uses: docker/build-push-action@v6
        with:
          context: .
          file: etl/Dockerfile
          push: false
          cache-from: type=gha,scope=etl
          cache-to: type=gha,mode=max,scope=etl
